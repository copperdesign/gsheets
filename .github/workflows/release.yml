# Publish to npm when a GitHub Release is published.
#
# The flow: bump the version in package.json, commit, tag (`v0.2.0`),
# push, then draft + publish a Release on GitHub. This workflow picks
# up the `release: published` event, runs the smoke checks, and
# publishes the tagged version to npm under the @copperdesign scope.
#
# Why "on release" and not "on tag push"?
# - The release UI is where the changelog / notes live anyway, so it's
#   the natural "I'm ready" signal.
# - Drafting a release without publishing it lets you stage notes
#   without triggering anything.
# - It separates "tag exists" (cheap, reversible) from "shipped to npm"
#   (public, irreversible).
#
# Authentication: npm Trusted Publishing (OIDC), no stored token.
# - npmjs.com → the package → Settings → Trusted Publisher: GitHub Actions,
#   copperdesign/gsheets, workflow `release.yml`, no environment,
#   "Allow npm publish" ticked. Set up 2026-11-03.
# - The repo name must stay all lowercase. npm lowercases the repository
#   when the Trusted Publisher is saved, but GitHub's token carries the
#   repo's real casing, so a mixed-case name never matches and the publish
#   fails with a bare 404. That is why the repo was renamed from its old
#   mixed-case name on 2026-11-03.
# - The job mints an OIDC token (`id-token: write`); npm exchanges it for a
#   short-lived publish credential. Nothing to rotate, nothing to leak — the
#   NPM_TOKEN secret this replaced stopped being accepted in 2026.
# - Needs npm >= 11.5.1, hence Node 24 below (Node 22 still ships npm 10).
# - First publish of a scoped package on a free npm plan requires
#   `--access public`; that's in package.json under `publishConfig`.
#
# Provenance:
# - Automatic with Trusted Publishing from a public repo: npm signs an
#   attestation tying the tarball to this workflow run on this commit.
#   Visible on the npm package page; nothing for consumers to configure.

name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest

    # Required for trusted publishing and provenance — the workflow mints an OIDC token
    # that npm verifies against the GitHub Actions issuer.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Smoke checks before publishing. The module is one file with no
      # build step, so the guard is narrow: confirm it still parses,
      # and that package metadata points at things that exist on disk.
      - name: parse check (index.js)
        run: node --check index.js

      - name: banner version matches package.json
        run: |
          # The /*! …vX.Y.Z … */ header on line 1 of index.js is the
          # license notice that survives minification. Easy to forget
          # to bump alongside package.json — catch the drift before
          # we ship a tarball with a stale banner.
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json').version;
            const src = fs.readFileSync('index.js', 'utf8');
            const m = src.match(/^\/\*!\s*gSheets\s+—\s+v(\d+\.\d+\.\d+)/);
            if (!m) {
              console.error('index.js banner not found or malformed (expected /*! gSheets — vX.Y.Z …)');
              process.exit(1);
            }
            if (m[1] !== pkg) {
              console.error('banner (' + m[1] + ') does not match package.json (' + pkg + ')');
              process.exit(1);
            }
          "

      - name: exports map subpaths resolve
        run: |
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            const entries = Object.values(pkg.exports).map(v =>
              typeof v === 'string' ? v : v.import || v.default
            );
            let bad = false;
            for (const entry of entries) {
              const path = entry.replace(/^\.\//, '');
              if (!fs.existsSync(path)) {
                console.error('exports entry missing on disk:', entry);
                bad = true;
              }
            }
            if (bad) process.exit(1);
          "

      - name: files allowlist points at real paths
        run: |
          # pkg.files is the npm publish allowlist. If an entry doesn't
          # exist on disk we'd publish a tarball missing whatever the
          # README promised — catch it now.
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            let bad = false;
            for (const entry of pkg.files || []) {
              if (!fs.existsSync(entry)) {
                console.error('files entry missing on disk:', entry);
                bad = true;
              }
            }
            if (bad) process.exit(1);
          "

      - name: tag matches package.json version
        run: |
          # release.tag_name is e.g. "v0.2.0" — strip the leading v and
          # compare to package.json. Catches the "forgot to bump
          # version" mistake before it produces a confusing 403 from
          # npm.
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag ($tag) does not match package.json version ($pkg)" >&2
            exit 1
          fi

      # Trusted Publishing silently needs a recent npm; an older one falls
      # back to token auth and fails with an unhelpful 404. Say it plainly.
      - name: npm supports trusted publishing
        run: |
          npm_version=$(npm --version)
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$npm_version" \
            || { echo "npm $npm_version is older than 11.5.1, which trusted publishing needs" >&2; exit 1; }

      - name: publish
        run: npm publish
